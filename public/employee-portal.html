<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Portal — Aladdin Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #FF681A;
      --primary-light: #FFF7F3;
      --primary-border: #FFD5B8;
      --success: #16A34A;
      --success-bg: #F0FDF4;
      --success-border: #BBF7D0;
      --info: #2563EB;
      --info-bg: #EFF6FF;
      --info-border: #BFDBFE;
      --warning: #D97706;
      --warning-bg: #FFFBEB;
      --warning-border: #FDE68A;
      --danger: #DC2626;
      --danger-bg: #FEF2F2;
      --danger-border: #FECACA;
      --surface: #fff;
      --surface-2: #F9FAFB;
      --border: #E5E7EB;
      --text: #111827;
      --text-2: #6B7280;
      --radius: 12px;
    }
    body {
      font-family: 'Barlow', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F4F6FA;
      color: var(--text);
      min-height: 100vh;
    }
    .portal-header {
      background: linear-gradient(135deg, #0F1B2D 0%, #1E2D40 100%);
      padding: 0 24px;
    }
    .portal-header-inner {
      max-width: 860px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 32px; height: 32px; background: var(--primary); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; color: #fff;
    }
    .logo-text { font-size: 14px; font-weight: 700; color: #fff; }
    .logo-sub  { font-size: 10px; color: rgba(255,255,255,.45); margin-top: 1px; }
    .emp-badge { display: flex; align-items: center; gap: 8px; }
    .emp-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), #FF8C4A);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #fff;
    }
    .emp-name { font-size: 12px; font-weight: 600; color: #fff; }
    .emp-role { font-size: 10px; color: rgba(255,255,255,.5); }

    .portal-body { max-width: 860px; margin: 0 auto; padding: 28px 24px 60px; }

    .welcome-strip {
      background: linear-gradient(135deg, var(--primary) 0%, #FF8C4A 100%);
      border-radius: var(--radius); padding: 22px 28px; margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .welcome-text h2 { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .welcome-text p  { font-size: 12px; color: rgba(255,255,255,.75); }
    .leave-pills { display: flex; gap: 10px; flex-wrap: wrap; }
    .leave-pill {
      background: rgba(255,255,255,.18); border-radius: 8px; padding: 8px 14px; text-align: center;
    }
    .leave-pill .pill-val { font-size: 20px; font-weight: 800; color: #fff; }
    .leave-pill .pill-lbl { font-size: 9px; color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: .07em; }

    .card {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 24px; margin-bottom: 20px;
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .card-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }

    .tabs {
      display: flex; gap: 4px; background: var(--surface-2);
      border-radius: 10px; padding: 4px; margin-bottom: 24px;
    }
    .tab-btn {
      flex: 1; padding: 9px 12px; font-size: 12px; font-weight: 600;
      border: none; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--text-2); transition: all .15s;
    }
    .tab-btn.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media(max-width:540px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    label {
      font-size: 11px; font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: .05em;
    }
    .input {
      padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 13px; color: var(--text); background: var(--surface);
      width: 100%; outline: none; transition: border-color .15s; font-family: inherit;
    }
    .input:focus { border-color: var(--primary); }
    select.input { cursor: pointer; }
    textarea.input { resize: vertical; }

    .wd-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--info-bg); border: 1px solid var(--info-border);
      border-radius: 7px; padding: 5px 11px;
      font-size: 12px; font-weight: 700; color: var(--info);
    }

    .btn-submit {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, var(--primary), #FF8C4A);
      color: #fff; font-size: 14px; font-weight: 700;
      border: none; border-radius: 9px; cursor: pointer; margin-top: 18px;
      transition: opacity .15s;
    }
    .btn-submit:hover   { opacity: .92; }
    .btn-submit:disabled { opacity: .55; cursor: default; }

    .policy-text {
      font-size: 13px; line-height: 1.75; color: #374151;
      white-space: pre-wrap; background: var(--surface-2);
      border-radius: 8px; padding: 16px;
    }

    .alert { border-radius: 9px; padding: 13px 16px; font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
    .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: #15803D; }
    .alert-error   { background: var(--danger-bg);  border: 1px solid var(--danger-border);  color: #B91C1C; }

    /* Auth screens */
    .auth-wrap {
      display: flex; min-height: calc(100vh - 60px); overflow: hidden;
    }
    /* Left form side */
    .auth-form-side {
      flex: 0 0 420px;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 36px; background: #fff;
      box-shadow: 4px 0 24px rgba(0,0,0,.06);
    }
    .auth-box { width: 100%; max-width: 340px; }
    .auth-vid-wrap { margin-bottom: 22px; }
    .auth-vid-wrap video { width: 150px; height: auto; display: block; border-radius: 10px; object-fit: contain; }
    .auth-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,102,0,.08); border: 1px solid rgba(255,102,0,.18);
      border-radius: 20px; padding: 4px 12px; margin-bottom: 18px;
    }
    .auth-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--primary); animation: authblink 2s ease infinite; }
    @keyframes authblink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .auth-badge-label { font-size: 11px; font-weight: 600; color: var(--primary); letter-spacing: .03em; }
    .auth-box h2 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 4px; font-family: 'Montserrat', sans-serif; }
    .auth-box p  { font-size: 12px; color: #888; margin-bottom: 22px; line-height: 1.6; }
    .auth-group  { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .auth-group label { font-size: 10.5px; font-weight: 700; color: #666; letter-spacing: .05em; text-transform: uppercase; }
    .auth-group input {
      width: 100%; background: #F8F9FB; border: 1.5px solid #E4E7ED;
      border-radius: 9px; padding: 11px 14px; font-size: 13px;
      color: #111; outline: none; transition: border .15s, box-shadow .15s;
      font-family: 'Barlow', sans-serif;
    }
    .auth-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,102,0,.1); }
    .auth-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #FF6600, #FF8800);
      color: #fff; font-size: 13.5px; font-weight: 700;
      border: none; border-radius: 9px; cursor: pointer; margin-top: 6px;
      font-family: 'Montserrat', sans-serif; letter-spacing: .02em;
      transition: opacity .15s, transform .1s;
      box-shadow: 0 4px 16px rgba(255,102,0,.32);
    }
    .auth-btn:hover    { opacity: .91; }
    .auth-btn:active   { transform: scale(.98); }
    .auth-btn:disabled { opacity: .55; cursor: default; transform: none; }
    .auth-footer { font-size: 11.5px; color: #aaa; margin-top: 16px; text-align: center; }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    /* Right brand side */
    .auth-brand-side {
      flex: 1;
      background: linear-gradient(155deg, #FFFAF7 0%, #FFF5EE 40%, #FFFBF8 70%, #F8F4FF 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 48px; position: relative; overflow: hidden; gap: 14px;
    }
    .auth-brand-side::before {
      content: ''; position: absolute; top: -120px; left: -80px;
      width: 440px; height: 440px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,102,0,.10) 0%, transparent 70%);
      animation: ablobA 8s ease-in-out infinite alternate; pointer-events: none;
    }
    .auth-brand-side::after {
      content: ''; position: absolute; bottom: -100px; right: -60px;
      width: 360px; height: 360px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,120,40,.08) 0%, transparent 70%);
      animation: ablobB 10s ease-in-out infinite alternate; pointer-events: none;
    }
    @keyframes ablobA { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(30px,20px) scale(1.12)} }
    @keyframes ablobB { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-20px,-30px) scale(1.1)} }
    .auth-img-wrap {
      position: relative; z-index: 2; margin-bottom: 24px;
      animation: authImgIn 1.4s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes authImgIn { 0%{opacity:0;transform:translateY(60px) scale(.55)} 60%{opacity:1;transform:translateY(-8px) scale(1.04)} 100%{transform:translateY(0) scale(1)} }
    .auth-img-wrap::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      width: 200px; height: 200px; border-radius: 50%;
      transform: translate(-50%,-50%);
      background: radial-gradient(circle, rgba(255,102,0,.18) 0%, transparent 70%);
      animation: authGlow 3s ease-in-out infinite;
    }
    @keyframes authGlow { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7} 50%{transform:translate(-50%,-50%) scale(1.25);opacity:1} }
    .auth-brand-title { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 800; color: #111; text-align: center; letter-spacing: -.02em; position: relative; z-index: 2; animation: authFadeUp .8s ease .9s both; }
    .auth-brand-title span { color: var(--primary); }
    .auth-brand-sub { font-size: 10px; color: #AAA; text-align: center; letter-spacing: .12em; text-transform: uppercase; position: relative; z-index: 2; animation: authFadeUp .8s ease 1.1s both; }
    @keyframes authFadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    .auth-feature-row { display: flex; gap: 10px; width: 100%; max-width: 440px; position: relative; z-index: 2; animation: authFadeUp .6s ease 1.3s both; margin-top: 6px; }
    .auth-feat { flex: 1; background: #fff; border: 1px solid #F0E4DC; border-radius: 12px; padding: 12px 10px; text-align: center; box-shadow: 0 1px 6px rgba(0,0,0,.05); }
    .auth-feat-icon { font-size: 20px; margin-bottom: 5px; }
    .auth-feat-lbl { font-size: 9.5px; color: #999; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
    .auth-feat-val { font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; color: #111; }
    @media (max-width: 700px) {
      .auth-wrap { flex-direction: column; }
      .auth-brand-side { flex: 0 0 auto; padding: 24px 20px; min-height: 200px; }
      .auth-feature-row { display: none; }
      .auth-form-side { flex: 1; padding: 28px 20px; }
    }

    .loading-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; gap: 12px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border); border-top-color: var(--primary);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 60vh; gap: 10px; text-align: center; padding: 24px;
    }
    .error-screen h2 { font-size: 20px; font-weight: 700; }
    .error-screen p  { font-size: 13px; color: var(--text-2); max-width: 360px; line-height: 1.65; }
  </style>
</head>
<body>

<div class="portal-header">
  <div class="portal-header-inner">
    <div class="logo">
      <div class="logo-mark">A</div>
      <div>
        <div class="logo-text">Aladdin Finance</div>
        <div class="logo-sub">Employee Portal</div>
      </div>
    </div>
    <div class="emp-badge" id="header-emp" style="display:none">
      <div class="emp-avatar" id="header-avatar"></div>
      <div>
        <div class="emp-name" id="header-name"></div>
        <div class="emp-role" id="header-role"></div>
      </div>
    </div>
  </div>
</div>

<div id="portal-body">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div style="font-size:13px;color:var(--text-2)">Loading your portal…</div>
  </div>
</div>

<script>
const _pathParts  = location.pathname.split('/').filter(Boolean);
const token       = _pathParts.length >= 2 ? _pathParts[1] : null;
const SESSION_KEY = `portal_authed_${token}`;
let portalData    = null;

async function init() {
  // No token in URL → show plain email+password login
  if (!token) { renderEmailLogin(); return; }

  try {
    const r = await fetch(`/api/hr/portal/${token}`);
    if (!r.ok) throw new Error((await r.json()).error || 'Not found');
    portalData = await r.json();
    if (!portalData.portalEnabled) throw new Error('Portal is currently disabled. Please contact HR.');

    if (!portalData.passwordSet) {
      renderSetPassword();
    } else if (!sessionStorage.getItem(SESSION_KEY)) {
      renderLogin();
    } else {
      renderPortal();
    }
  } catch(e) {
    document.getElementById('portal-body').innerHTML = `
      <div class="error-screen">
        <div style="font-size:48px">🔒</div>
        <h2>Portal Unavailable</h2>
        <p>${esc(e.message)}</p>
        <a href="/employee-portal" style="font-size:13px;color:var(--primary);margin-top:8px">← Go to employee login</a>
      </div>`;
  }
}

function renderEmailLogin() {
  document.getElementById('portal-body').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-form-side">
        <div class="auth-box">
          <div class="auth-vid-wrap">
            <video src="/media/aladdinb2b_logo.mp4" autoplay loop muted playsinline></video>
          </div>
          <div class="auth-badge"><div class="auth-dot"></div><span class="auth-badge-label">Employee Self-Service Portal</span></div>
          <h2>Employee Sign In</h2>
          <p>Enter your work email and the password you created when you first received your portal invite.</p>
          <div id="el-msg" class="msg"></div>
          <div class="auth-group">
            <label>Work Email</label>
            <input type="email" id="el-email" placeholder="your.name@company.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('el-pw').focus()">
          </div>
          <div class="auth-group">
            <label>Password</label>
            <input type="password" id="el-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doEmailLogin()">
          </div>
          <button class="auth-btn" id="el-btn" onclick="doEmailLogin()">Sign In →</button>
          <p style="font-size:11px;color:#aaa;margin-top:16px;line-height:1.6">First time? Open the <strong style="color:var(--primary)">invite link</strong> sent to your email to set your password before signing in here.</p>
        </div>
      </div>
      ${authBrandPanel()}
    </div>`;
}

async function doEmailLogin() {
  const email = (document.getElementById('el-email')?.value || '').trim();
  const pw    = document.getElementById('el-pw')?.value || '';
  const btn   = document.getElementById('el-btn');
  if (!email) { showAuthMsg('el-msg','error','Please enter your email address.'); return; }
  if (!pw)    { showAuthMsg('el-msg','error','Please enter your password.'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/hr/portal/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pw })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login failed');
    sessionStorage.setItem(`portal_authed_${data.token}`, '1');
    showAuthMsg('el-msg','success','Login successful! Redirecting…');
    setTimeout(() => { location.href = `/employee-portal/${data.token}`; }, 700);
  } catch(e) {
    showAuthMsg('el-msg','error', e.message);
    btn.disabled = false; btn.textContent = 'Sign In →';
  }
}

function authBrandPanel() {
  return `<div class="auth-brand-side">
    <div class="auth-img-wrap">
      <div style="width:220px;height:220px;border-radius:50%;overflow:hidden;box-shadow:0 0 22px rgba(255,102,0,.65),0 0 55px rgba(255,102,0,.28)">
        <img src="/media/pic.JPEG" alt="Aladdin Finance" style="width:100%;height:100%;object-fit:cover;object-position:center center;display:block;">
      </div>
    </div>
    <div class="auth-brand-title">Aladdin <span>Finance</span></div>
    <div class="auth-brand-sub">Employee Self-Service Portal</div>
    <div class="auth-feature-row">
      <div class="auth-feat"><div class="auth-feat-icon">🏖</div><div class="auth-feat-lbl">Leave</div><div class="auth-feat-val">Submit & Track</div></div>
      <div class="auth-feat"><div class="auth-feat-icon">📋</div><div class="auth-feat-lbl">Requests</div><div class="auth-feat-val">HR & Finance</div></div>
      <div class="auth-feat"><div class="auth-feat-icon">📄</div><div class="auth-feat-lbl">Policy</div><div class="auth-feat-val">Always Available</div></div>
    </div>
  </div>`;
}

function renderSetPassword() {
  document.getElementById('portal-body').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-form-side">
        <div class="auth-box">
          <div class="auth-vid-wrap">
            <video src="/media/aladdinb2b_logo.mp4" autoplay loop muted playsinline></video>
          </div>
          <div class="auth-badge"><div class="auth-dot"></div><span class="auth-badge-label">First-time Setup</span></div>
          <h2>Set Your Password</h2>
          <p>Welcome to Aladdin Finance! Create a secure password to protect your employee portal.</p>
          <div id="sp-msg" class="msg"></div>
          <div class="auth-group">
            <label>New Password <span style="font-weight:400;text-transform:none;font-size:10px">(min 6 characters)</span></label>
            <input type="password" id="sp-pw1" placeholder="Choose a strong password" autocomplete="new-password">
          </div>
          <div class="auth-group">
            <label>Confirm Password</label>
            <input type="password" id="sp-pw2" placeholder="Repeat your password" autocomplete="new-password" onkeydown="if(event.key==='Enter')doSetPassword()">
          </div>
          <button class="auth-btn" id="sp-btn" onclick="doSetPassword()">Set Password & Enter Portal →</button>
        </div>
      </div>
      ${authBrandPanel()}
    </div>`;
}

async function doSetPassword() {
  const pw1   = document.getElementById('sp-pw1').value;
  const pw2   = document.getElementById('sp-pw2').value;
  const btn   = document.getElementById('sp-btn');
  if (pw1.length < 6)  { showAuthMsg('sp-msg','error','Password must be at least 6 characters.'); return; }
  if (pw1 !== pw2)     { showAuthMsg('sp-msg','error','Passwords do not match.'); return; }
  btn.disabled = true; btn.textContent = 'Setting password…';
  try {
    const r = await fetch(`/api/hr/portal/${token}/set-password`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ password: pw1 })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Failed');
    showAuthMsg('sp-msg','success','Password set! Loading your portal…');
    portalData.passwordSet = true;
    sessionStorage.setItem(SESSION_KEY, '1');
    setTimeout(() => renderPortal(), 900);
  } catch(e) {
    showAuthMsg('sp-msg','error',e.message);
    btn.disabled = false; btn.textContent = 'Set Password & Enter Portal →';
  }
}

function renderLogin() {
  const emp = portalData.employee;
  document.getElementById('portal-body').innerHTML = `
    <div class="auth-wrap">
      <div class="auth-form-side">
        <div class="auth-box">
          <div class="auth-vid-wrap">
            <video src="/media/aladdinb2b_logo.mp4" autoplay loop muted playsinline></video>
          </div>
          <div class="auth-badge"><div class="auth-dot"></div><span class="auth-badge-label">Employee Portal</span></div>
          <h2>Welcome back${emp?.firstName ? ', ' + emp.firstName : ''}</h2>
          <p>Enter your work email and password to access your self-service portal.</p>
          <div id="login-msg" class="msg"></div>
          <div class="auth-group">
            <label>Work Email</label>
            <input type="email" id="login-email" value="${emp?.email || ''}" placeholder="your.name@company.com" autocomplete="email" onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()">
          </div>
          <div class="auth-group">
            <label>Password</label>
            <input type="password" id="login-pw" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doPortalLogin()">
          </div>
          <button class="auth-btn" id="login-btn" onclick="doPortalLogin()">Sign In →</button>
        </div>
      </div>
      ${authBrandPanel()}
    </div>`;
}

async function doPortalLogin() {
  const emailEl = document.getElementById('login-email');
  const email = (emailEl?.value || portalData.employee?.email || '').trim();
  const pw    = document.getElementById('login-pw').value;
  const btn   = document.getElementById('login-btn');
  if (!email) { showAuthMsg('login-msg','error','Please enter your email address.'); return; }
  if (!pw)    { showAuthMsg('login-msg','error','Please enter your password.'); return; }
  btn.disabled = true; btn.textContent = 'Verifying…';
  try {
    const r = await fetch('/api/hr/portal/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password: pw })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login failed');
    sessionStorage.setItem(SESSION_KEY,'1');
    renderPortal();
  } catch(e) {
    showAuthMsg('login-msg','error',e.message);
    btn.disabled = false; btn.textContent = 'Sign In →';
  }
}

function renderPortal() {
  const emp    = portalData.employee;
  const ltypes = portalData.leaveTypes || [];
  const bal    = emp.leaveBalances || {};
  const initials = `${(emp.firstName||'?')[0]}${(emp.lastName||'?')[0]}`.toUpperCase();

  document.getElementById('header-emp').style.display  = 'flex';
  document.getElementById('header-avatar').textContent = initials;
  document.getElementById('header-name').textContent   = `${emp.firstName} ${emp.lastName}`;
  document.getElementById('header-role').textContent   = emp.position || emp.department || '';

  const pills = ltypes.slice(0,3).map(lt => {
    const days = bal[lt.id] ?? 0;
    return `<div class="leave-pill">
      <div class="pill-val">${days}</div>
      <div class="pill-lbl">${lt.name.replace(' Leave','')}</div>
    </div>`;
  }).join('');

  document.getElementById('portal-body').innerHTML = `
    <div class="portal-body">
      <div class="welcome-strip">
        <div class="welcome-text">
          <h2>Welcome, ${emp.firstName}!</h2>
          <p>${emp.position || ''} · ${emp.department || ''} · ID: ${emp.employeeId || '—'}</p>
        </div>
        <div class="leave-pills">${pills}</div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-timeoff" onclick="switchTab('timeoff')">🏖 Time Off</button>
        <button class="tab-btn"        id="tab-request" onclick="switchTab('request')">📋 Request</button>
        <button class="tab-btn"        id="tab-policy"  onclick="switchTab('policy')">📄 Policy</button>
      </div>

      <div id="panel-timeoff">
        <div class="card">
          <div class="card-title">
            <div class="card-icon" style="background:var(--info-bg);color:var(--info)">🏖</div>
            Request Time Off
          </div>
          <div id="timeoff-msg"></div>
          <div class="form-grid">
            <div class="form-group">
              <label>Leave Type</label>
              <select class="input" id="tof-type" onchange="calcWorkingDays()">
                <option value="">Select type…</option>
                ${ltypes.map(lt => `<option value="${lt.id}">${lt.name} (${bal[lt.id]??0} days remaining)</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="align-self:end">
              <label>Working Days</label>
              <div class="wd-badge"><span>📅</span> <span id="wd-count">—</span></div>
            </div>
            <div class="form-group">
              <label>Start Date</label>
              <input type="date" class="input" id="tof-start" onchange="calcWorkingDays()">
            </div>
            <div class="form-group">
              <label>End Date</label>
              <input type="date" class="input" id="tof-end" onchange="calcWorkingDays()">
            </div>
            <div class="form-group full">
              <label>Reason <span style="font-weight:400;text-transform:none;font-size:10px">(optional)</span></label>
              <textarea class="input" id="tof-reason" rows="3" placeholder="Briefly describe the reason for your leave…"></textarea>
            </div>
          </div>
          <button class="btn-submit" id="tof-submit" onclick="submitTimeOff()">Submit Leave Request</button>
        </div>
      </div>

      <div id="panel-request" style="display:none">
        <div class="card">
          <div class="card-title">
            <div class="card-icon" style="background:var(--primary-light);color:var(--primary)">📋</div>
            Submit a Request
          </div>
          <div id="req-msg"></div>
          <div class="form-grid">
            <div class="form-group">
              <label>Route To</label>
              <select class="input" id="req-route">
                <option value="hr">HR Team</option>
                <option value="finance">Finance Team</option>
              </select>
            </div>
            <div class="form-group">
              <label>Priority</label>
              <select class="input" id="req-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Subject *</label>
              <input class="input" id="req-subject" placeholder="What do you need?">
            </div>
            <div class="form-group full">
              <label>Details <span style="font-weight:400;text-transform:none;font-size:10px">(optional)</span></label>
              <textarea class="input" id="req-body" rows="4" placeholder="Provide any additional details or context…"></textarea>
            </div>
          </div>
          <button class="btn-submit" id="req-submit" onclick="submitRequest()">Submit Request</button>
        </div>
      </div>

      <div id="panel-policy" style="display:none">
        <div class="card">
          <div class="card-title">
            <div class="card-icon" style="background:#F3F4F6;color:#374151">📄</div>
            Company Policy
          </div>
          <div class="policy-text" id="policy-content"></div>
        </div>
      </div>
    </div>`;
  // Render policy as HTML (not escaped text)
  const policyEl = document.getElementById('policy-content');
  if (policyEl) {
    const raw = portalData.policy || '';
    policyEl.innerHTML = raw || '<p style="color:#6B7280">No company policy has been set yet. Please contact HR.</p>';
  }
}

function switchTab(name) {
  ['timeoff','request','policy'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === name);
    document.getElementById(`panel-${t}`).style.display = t === name ? '' : 'none';
  });
}

function countWorkingDays(startStr, endStr) {
  let count = 0;
  const end = new Date(endStr + 'T00:00:00');
  const cur = new Date(startStr + 'T00:00:00');
  while (cur <= end) {
    const d = cur.getDay();
    if (d !== 0 && d !== 6) count++; // skip Sunday=0, Saturday=6
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

function calcWorkingDays() {
  const start = document.getElementById('tof-start')?.value;
  const end   = document.getElementById('tof-end')?.value;
  const el    = document.getElementById('wd-count');
  if (!el) return;
  if (!start || !end || end < start) { el.textContent = '—'; return; }
  const days = countWorkingDays(start, end);
  el.textContent = `${days} working day${days !== 1 ? 's' : ''}`;
}

async function submitTimeOff() {
  const type   = document.getElementById('tof-type').value;
  const start  = document.getElementById('tof-start').value;
  const end    = document.getElementById('tof-end').value;
  const reason = document.getElementById('tof-reason').value.trim();
  const msgEl  = document.getElementById('timeoff-msg');
  if (!type)       { showMsg(msgEl,'error','Please select a leave type.'); return; }
  if (!start)      { showMsg(msgEl,'error','Please select a start date.'); return; }
  if (!end)        { showMsg(msgEl,'error','Please select an end date.'); return; }
  if (end < start) { showMsg(msgEl,'error','End date cannot be before start date.'); return; }
  const days = countWorkingDays(start, end);
  if (days === 0)  { showMsg(msgEl,'error','Selected dates have no working days (Mon–Fri).'); return; }
  const btn = document.getElementById('tof-submit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await fetch(`/api/hr/portal/${token}/time-off`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ type, startDate:start, endDate:end, days, reason })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Failed to submit');
    showMsg(msgEl,'success',`Leave request submitted (${days} working day${days!==1?'s':''}). HR will be in touch soon.`);
    document.getElementById('tof-type').value = '';
    document.getElementById('tof-start').value = '';
    document.getElementById('tof-end').value   = '';
    document.getElementById('tof-reason').value = '';
    document.getElementById('wd-count').textContent = '—';
  } catch(e) {
    showMsg(msgEl,'error',e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Submit Leave Request';
  }
}

async function submitRequest() {
  const subject  = document.getElementById('req-subject').value.trim();
  const body     = document.getElementById('req-body').value.trim();
  const priority = document.getElementById('req-priority').value;
  const routeTo  = document.getElementById('req-route').value;
  const msgEl    = document.getElementById('req-msg');
  if (!subject) { showMsg(msgEl,'error','Please enter a subject.'); return; }
  const btn = document.getElementById('req-submit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const r = await fetch(`/api/hr/portal/${token}/request`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ subject, body, priority, routeTo })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Failed to submit');
    const label = routeTo === 'finance' ? 'Finance' : 'HR';
    showMsg(msgEl,'success',`Request submitted to the ${label} team. You'll receive a confirmation email.`);
    document.getElementById('req-subject').value = '';
    document.getElementById('req-body').value    = '';
  } catch(e) {
    showMsg(msgEl,'error',e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Submit Request';
  }
}

function showMsg(el, type, text) {
  if (!el) return;
  el.innerHTML = `<div class="alert alert-${type === 'success' ? 'success' : 'error'}">${esc(text)}</div>`;
  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function showAuthMsg(id, type, text) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = `msg ${type} show`;
  el.textContent = text;
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
