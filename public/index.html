<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aladdin Finance — CFO Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --border:rgba(0,0,0,0.08); --border-2:rgba(0,0,0,0.15);
  --primary:#f97316; --primary-bg:#fff7ed; --primary-text:#7c2d12;
  --success:#16a34a; --success-bg:#f0fdf4; --success-text:#14532d;
  --danger:#dc2626; --danger-bg:#fef2f2; --danger-text:#7f1d1d;
  --warning:#d97706; --warning-bg:#fffbeb; --warning-text:#78350f;
  --info:#2563eb; --info-bg:#eff6ff; --info-text:#1e3a8a;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;color:var(--text);background:var(--bg);min-height:100vh}
.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.sidebar{background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;padding:14px 10px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:4px}
.logo-icon{width:36px;height:36px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;flex-shrink:0}
.logo-name{font-size:13px;font-weight:600}
.logo-sub{font-size:10px;color:#94a3b8}
.nav-sec{font-size:10px;color:#64748b;letter-spacing:.08em;text-transform:uppercase;padding:10px 10px 5px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;font-size:12px;color:#cbd5e1;cursor:pointer;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left;transition:all .12s}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:500}
.nav-icon{width:14px;height:14px;flex-shrink:0;opacity:.85}
.secure-box{margin-top:auto;border:0.5px solid rgba(255,255,255,.12);border-radius:8px;padding:10px}
.secure-box p{font-size:11px;font-weight:500;color:#e2e8f0}
.secure-box span{font-size:10px;color:#94a3b8}
.main{display:flex;flex-direction:column;background:var(--bg)}
.topbar{background:var(--surface);border-bottom:0.5px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-title{font-size:15px;font-weight:600}
.topbar-sub{font-size:11px;color:var(--text-2);margin-top:2px}
.topbar-right{display:flex;gap:8px;align-items:center}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--success-bg);color:var(--success-text);border:0.5px solid #bbf7d0}
.sync-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success)}
.sync-dot.spin{background:var(--warning);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn{font-size:12px;padding:6px 12px;border-radius:7px;border:0.5px solid var(--border-2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:#0f172a;color:#fff;border-color:#0f172a}
.btn-primary:hover{background:#1e293b}
.btn-sm{font-size:11px;padding:4px 10px}
.content{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.section{display:none;flex-direction:column;gap:14px}
.section.active{display:flex}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:10px;padding:14px 16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.card-title{font-size:13px;font-weight:600}
.card-desc{font-size:11px;color:var(--text-2);margin-top:2px}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;white-space:nowrap}
.tag-success{background:var(--success-bg);color:var(--success-text)}
.tag-warning{background:var(--warning-bg);color:var(--warning-text)}
.tag-info{background:var(--info-bg);color:var(--info-text)}
.tag-danger{background:var(--danger-bg);color:var(--danger-text)}
.tag-neutral{background:var(--surface-2);color:var(--text-2)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.clients-grid{display:grid;grid-template-columns:300px 1fr;gap:12px}
.metric{background:var(--surface-2);border-radius:8px;padding:11px 13px}
.metric-label{font-size:10px;color:var(--text-2);margin-bottom:3px;font-weight:500}
.metric-value{font-size:20px;font-weight:600;color:var(--text)}
.metric-sub{font-size:10px;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.view-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:7px;padding:3px;margin-bottom:10px}
.view-tab{flex:1;font-size:11px;padding:6px 10px;border-radius:5px;border:none;background:transparent;color:var(--text-2);cursor:pointer;font-weight:500}
.view-tab.active{background:var(--surface);color:var(--text);border:0.5px solid var(--border)}
.view-panel{display:none}
.view-panel.active{display:block}
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th{font-size:10px;font-weight:600;color:var(--text-2);text-align:left;padding:7px 8px;border-bottom:0.5px solid var(--border);white-space:nowrap;background:var(--surface-2)}
.table td{padding:6px 8px;border-bottom:0.5px solid var(--border);color:var(--text)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--surface-2)}
.input{background:var(--surface-2);border:0.5px solid var(--border-2);border-radius:5px;padding:4px 7px;font-size:11px;color:var(--text);font-family:inherit}
.input:focus{outline:none;border-color:var(--info);background:var(--surface)}
.input.modified{border-color:var(--primary);background:var(--primary-bg);color:var(--primary-text)}
.input-cell{width:90px}
.badge-qbo{font-size:9px;color:var(--info);background:var(--info-bg);padding:1px 5px;border-radius:3px;font-weight:500}
.badge-manual{font-size:9px;color:var(--warning-text);background:var(--warning-bg);padding:1px 5px;border-radius:3px;font-weight:500}
.badge-auto{font-size:9px;color:var(--success-text);background:var(--success-bg);padding:1px 5px;border-radius:3px;font-weight:500}
.val-pos{color:var(--success);font-weight:600}
.val-neg{color:var(--danger);font-weight:600}
.save-bar{display:none;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--warning-bg);border:0.5px solid #fcd34d;border-radius:7px;margin-top:10px}
.save-bar.visible{display:flex}
.save-hint{font-size:11px;color:var(--warning-text);font-weight:500}
.chart-wrap{height:180px;position:relative;width:100%}
.chart-wrap-lg{height:220px}
.chart-wrap-sm{height:140px}
.alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;margin-bottom:6px;font-size:11px}
.alert-r{background:var(--danger-bg);border:0.5px solid #fca5a5;color:var(--danger-text)}
.alert-a{background:var(--warning-bg);border:0.5px solid #fcd34d;color:var(--warning-text)}
.alert-g{background:var(--success-bg);border:0.5px solid #86efac;color:var(--success-text)}
.alert strong{font-weight:600}
.client-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0.5px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--surface);transition:all .12s}
.client-item:hover{background:var(--surface-2)}
.client-item.selected{border-color:var(--primary);background:var(--primary-bg)}
.client-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.client-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-sub{font-size:10px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-amount{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap}
.detail-row{display:flex;justify-content:space-between;padding:5px 0;font-size:11px;border-bottom:0.5px solid var(--border);gap:8px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--text-2)}
.detail-value{font-weight:500;color:var(--text);text-align:right}
.file-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:0.5px solid var(--border);border-radius:7px;margin-bottom:5px;background:var(--surface)}
.file-row:hover{background:var(--surface-2)}
.file-icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}
.fi-pdf{background:var(--danger-bg);color:var(--danger)}
.fi-xls{background:var(--success-bg);color:var(--success)}
.fi-doc{background:var(--info-bg);color:var(--info)}
.file-action{font-size:10px;padding:3px 8px;border:0.5px solid var(--border-2);border-radius:4px;background:transparent;color:var(--text-2);cursor:pointer;font-family:inherit}
.file-action:hover{background:var(--surface-2)}
.event-item{display:flex;gap:10px;padding:9px 11px;border:0.5px solid var(--border);border-radius:7px;cursor:pointer;background:var(--surface);margin-bottom:5px}
.event-item:hover{background:var(--surface-2)}
.event-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:28px}
.event-title{font-size:12px;font-weight:500;color:var(--text)}
.event-meta{font-size:10px;color:var(--text-2);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.countdown{font-size:10px;font-weight:600;padding:1px 6px;border-radius:3px}
.cd-urgent{background:var(--danger-bg);color:var(--danger-text)}
.cd-soon{background:var(--warning-bg);color:var(--warning-text)}
.cd-ok{background:var(--success-bg);color:var(--success-text)}
.task-row{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:0.5px solid var(--border)}
.task-row:last-child{border-bottom:none}
.checkbox{width:15px;height:15px;border:0.5px solid var(--border-2);border-radius:3px;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.checkbox.done{background:#0f172a;border-color:#0f172a}
.checkbox.done::after{content:'';width:5px;height:3px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.task-title{font-size:11px;line-height:1.4;color:var(--text)}
.task-title.done{text-decoration:line-through;color:var(--text-3)}
.task-due{font-size:10px;color:var(--text-3);margin-top:2px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-hd{font-size:9px;color:var(--text-3);text-align:center;padding:3px 0;font-weight:600}
.cal-day{font-size:11px;text-align:center;padding:5px 2px;border-radius:5px;cursor:pointer;min-height:26px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text)}
.cal-day:hover{background:var(--surface-2)}
.cal-day.today{background:#0f172a;color:#fff;font-weight:600}
.cal-day.dim{opacity:.3}
.cal-dot{width:3px;height:3px;border-radius:50%}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border-radius:10px;padding:16px;width:100%;max-width:420px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:14px;font-weight:600}
.modal-close{font-size:18px;cursor:pointer;color:var(--text-2);background:none;border:none;padding:0 6px;line-height:1}
.form-row{margin-bottom:10px}
.form-row label{font-size:11px;color:var(--text-2);display:block;margin-bottom:4px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;font-size:12px;padding:7px 9px;border:0.5px solid var(--border-2);border-radius:6px;background:var(--surface);color:var(--text);font-family:inherit}
.form-row textarea{height:56px;resize:none}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;top:16px;right:16px;background:#0f172a;color:#fff;font-size:12px;padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.search-input{width:100%;font-size:11px;padding:7px 10px;border:0.5px solid var(--border-2);border-radius:6px;margin-bottom:10px;background:var(--surface-2);color:var(--text);font-family:inherit}
.progress-track{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;width:60px;display:inline-block;vertical-align:middle}
.progress-fill{height:100%;border-radius:2px;background:var(--primary)}
.progress-fill.over{background:var(--danger)}
.reserve-row{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:var(--surface-2);border-radius:7px;margin-bottom:5px;gap:10px;font-size:11px}
.del-btn{color:var(--danger);font-size:13px;padding:2px 8px;border:0.5px solid #fecaca;border-radius:4px;cursor:pointer;background:transparent;line-height:1;font-family:inherit}
.del-btn:hover{background:var(--danger-bg)}
.qbo-source{display:inline-flex;align-items:center;gap:5px;font-size:10px;padding:3px 9px;border-radius:20px;background:var(--info-bg);color:var(--info);border:0.5px solid #bfdbfe;font-weight:500}
@media (max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.clients-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">A</div>
      <div><div class="logo-name">Aladdin</div><div class="logo-sub">CFO Center</div></div>
    </div>
    <div class="nav-sec">Overview</div>
    <button class="nav-item active" data-section="dashboard"><svg class="nav-icon" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/></svg>Dashboard</button>
    <div class="nav-sec">Finance</div>
    <button class="nav-item" data-section="cash"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="3" width="12" height="8" rx="1.5"/><path d="M1 6h12"/></svg>Cash & reserves</button>
    <button class="nav-item" data-section="cashflow"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><polyline points="1,10 4,6 7,8 10,4 13,2"/></svg>Cash flow</button>
    <button class="nav-item" data-section="budget"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="3" width="12" height="10" rx="1"/><path d="M1 7h12M5 3V1M9 3V1"/></svg>Budget</button>
    <button class="nav-item" data-section="revenue"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="8" width="2.5" height="5" rx=".5"/><rect x="6" y="5" width="2.5" height="8" rx=".5"/><rect x="10" y="2" width="2.5" height="11" rx=".5"/></svg>Revenue</button>
    <button class="nav-item" data-section="clients"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="5" cy="4" r="2"/><path d="M1 12c0-2.2 1.8-4 4-4s4 1.8 4 4"/><circle cx="11" cy="5" r="1.5"/><path d="M11 8.5c1.4 0 2.5 1.1 2.5 2.5"/></svg>Clients</button>
    <div class="nav-sec">Planning</div>
    <button class="nav-item" data-section="calendar"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="2" width="12" height="11" rx="1.5"/><path d="M1 6h12M4 1v2M10 1v2"/></svg>Calendar & tasks</button>
    <div class="nav-sec">Docs</div>
    <button class="nav-item" data-section="files"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 2h4l1.5 1.5H12v8H2V2z"/></svg>Gov. papers</button>
    <button class="nav-item" data-section="update"><svg class="nav-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 3a6 6 0 00-10 4M2 11a6 6 0 0010-4"/><path d="M12 3v3h-3M2 11v-3h3"/></svg>Update</button>
    <div class="secure-box">
      <div style="display:flex;align-items:center;gap:8px"><svg width="13" height="13" viewBox="0 0 14 14" fill="#f97316"><path d="M7 1L1 4v5c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V4L7 1z"/></svg>
      <div><p>Secure access</p><span>SSO · MFA · roles</span></div></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Finance Command Center</div>
        <div class="topbar-sub" id="today-date">Loading...</div>
      </div>
      <div class="topbar-right">
        <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">Connecting...</span></div>
        <button class="btn" id="sync-all-btn">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3a6 6 0 00-10 4M2 11a6 6 0 0010-4"/><path d="M12 3v3h-3M2 11v-3h3"/></svg>
          Update all
        </button>
        <span class="pill" id="rev-pill">Loading...</span>
      </div>
    </div>

    <div class="content" id="main-content"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-event">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Add event</div><button class="modal-close" onclick="closeModal('modal-event')">×</button></div>
    <div class="form-row"><label>Type</label><select id="evt-type"><option value="tax">Tax deadline</option><option value="meeting">Meeting</option><option value="deadline">Deadline</option><option value="task">Task</option><option value="planning">Planning</option></select></div>
    <div class="form-row"><label>Title</label><input type="text" id="evt-title" placeholder="e.g. VAT Q2 filing"></div>
    <div class="form-row"><label>Date</label><input type="date" id="evt-date"></div>
    <div class="form-row"><label>Recurring</label><select id="evt-recur"><option value="none">One-time</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="annual">Annual</option></select></div>
    <div class="form-row"><label>Note / amount</label><textarea id="evt-note" placeholder="e.g. $42,000 — Federal Tax Authority"></textarea></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal('modal-event')">Cancel</button><button class="btn btn-primary" onclick="saveEvent()">Save</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-client">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="client-modal-title">Add client</div><button class="modal-close" onclick="closeModal('modal-client')">×</button></div>
    <div style="background:var(--info-bg);border:0.5px solid #bfdbfe;border-radius:6px;padding:8px 11px;margin-bottom:11px;font-size:11px;color:var(--info-text)">Most fields auto-sync from QuickBooks. You can override any value manually.</div>
    <div class="form-row"><label>Client name <span class="badge-qbo">QBO</span></label><input type="text" id="cl-name" placeholder="e.g. Informa Markets"></div>
    <div class="form-row"><label>Type</label><select id="cl-type"><option>Enterprise</option><option>SMB</option><option>Government</option></select></div>
    <div class="form-row"><label>Country <span class="badge-manual">manual</span></label><input type="text" id="cl-country" placeholder="e.g. UAE"></div>
    <div class="form-row"><label>Annual revenue ($) <span class="badge-qbo">QBO</span></label><input type="number" id="cl-revenue" placeholder="196000"></div>
    <div class="form-row"><label>SaaS revenue ($) <span class="badge-manual">manual split</span></label><input type="number" id="cl-saas" placeholder="74000"></div>
    <div class="form-row"><label>Contract renewal date</label><input type="date" id="cl-renewal"></div>
    <div class="form-row"><label>CFO notes <span class="badge-manual">manual</span></label><textarea id="cl-notes" placeholder="Internal notes..."></textarea></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal('modal-client')">Cancel</button><button class="btn btn-primary" onclick="saveClient()">Save</button></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-reserve">
  <div class="modal">
    <div class="modal-header"><div class="modal-title">Add cash reserve</div><button class="modal-close" onclick="closeModal('modal-reserve')">×</button></div>
    <div class="form-row"><label>Bank</label><select id="rs-bank"><option>ENBD</option><option>Mashreq</option><option>Wio</option><option>Stripe</option></select></div>
    <div class="form-row"><label>Reserve name</label><input type="text" id="rs-name" placeholder="e.g. VAT provision, Payroll reserve"></div>
    <div class="form-row"><label>Amount ($)</label><input type="number" id="rs-amount" placeholder="42000"></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal('modal-reserve')">Cancel</button><button class="btn btn-primary" onclick="saveReserve()">Save</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js"></script>
</body>
</html>
